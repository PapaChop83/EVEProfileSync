name: build-and-release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EVEProfileSync.sln

      - name: Build
        run: dotnet build EVEProfileSync.sln -c Release --no-restore

      - name: Test
        run: dotnet test EVEProfileSync.sln -c Release --no-build

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CODE_SIGN_TIMESTAMP_URL: http://timestamp.digicert.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish win-x64 portable build
        run: >
          dotnet publish .\src\EVEProfileSync.App\EVEProfileSync.App.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o .\artifacts\publish\win-x64

      - name: Prepare code-signing certificate
        if: ${{ secrets.CODE_SIGN_CERT_BASE64 != '' && secrets.CODE_SIGN_CERT_PASSWORD != '' }}
        run: |
          $certDir = Join-Path $PWD 'artifacts\signing'
          New-Item -ItemType Directory -Path $certDir -Force | Out-Null
          $certPath = Join-Path $certDir 'codesign.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String("${{ secrets.CODE_SIGN_CERT_BASE64 }}"))
          "CODE_SIGN_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Resolve SignTool path
        if: ${{ env.CODE_SIGN_CERT_PATH != '' }}
        run: |
          $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like '*\x64\signtool.exe' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) {
            throw 'signtool.exe was not found on the GitHub Actions runner.'
          }

          "SIGNTOOL_PATH=$signTool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Sign portable app binaries
        if: ${{ env.CODE_SIGN_CERT_PATH != '' && env.SIGNTOOL_PATH != '' }}
        run: |
          $targets = Get-ChildItem .\artifacts\publish\win-x64 -Recurse -File -Include *.exe,*.dll
          foreach ($target in $targets) {
            & $env:SIGNTOOL_PATH sign `
              /fd sha256 `
              /td sha256 `
              /tr $env:CODE_SIGN_TIMESTAMP_URL `
              /f $env:CODE_SIGN_CERT_PATH `
              /p "${{ secrets.CODE_SIGN_CERT_PASSWORD }}" `
              $target.FullName
          }
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Resolve release version
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Build installer
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          ".\installer\EVEProfileSync.iss"
          "/DMyAppVersion=${{ env.RELEASE_VERSION }}"
        shell: pwsh

      - name: Create stable installer filename
        run: |
          $installer = Get-ChildItem .\artifacts\installer\EVEProfileSync-Setup-*.exe | Select-Object -First 1
          Copy-Item $installer.FullName .\artifacts\installer\EVEProfileSync-Setup.exe -Force
        shell: pwsh

      - name: Sign installer binaries
        if: ${{ env.CODE_SIGN_CERT_PATH != '' && env.SIGNTOOL_PATH != '' }}
        run: |
          $targets = Get-ChildItem .\artifacts\installer -File -Filter EVEProfileSync-Setup*.exe
          foreach ($target in $targets) {
            & $env:SIGNTOOL_PATH sign `
              /fd sha256 `
              /td sha256 `
              /tr $env:CODE_SIGN_TIMESTAMP_URL `
              /f $env:CODE_SIGN_CERT_PATH `
              /p "${{ secrets.CODE_SIGN_CERT_PASSWORD }}" `
              $target.FullName
          }
        shell: pwsh

      - name: Archive release
        run: Compress-Archive -Path .\artifacts\publish\win-x64\* -DestinationPath .\artifacts\EVEProfileSync-win-x64.zip -Force
        shell: pwsh

      - name: Upload portable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EVEProfileSync-win-x64
          path: .\artifacts\EVEProfileSync-win-x64.zip

      - name: Upload installer workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EVEProfileSync-Setup
          path: |
            .\artifacts\installer\EVEProfileSync-Setup-*.exe
            .\artifacts\installer\EVEProfileSync-Setup.exe

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .\artifacts\EVEProfileSync-win-x64.zip
            .\artifacts\installer\EVEProfileSync-Setup-*.exe
            .\artifacts\installer\EVEProfileSync-Setup.exe
          generate_release_notes: true
