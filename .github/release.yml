changelog:
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Packaging and CI
      labels:
        - build
        - ci
        - installer
    - title: Other changes
      labels:
        - "*"
  exclude:
    labels:
      - skip-changelog
